<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>registration Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center p-6 bg-gray-50">

  <h1 class="text-3xl font-bold mb-6">REGISTRATION FORM</h1>

  <div class="border p-6 w-80 rounded shadow-md bg-white">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Name</label>
      <input type="text" id="name" class="w-full border p-2 rounded">
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Age</label>
      <input type="number" id="age" class="w-full border p-2 rounded">
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Gender</label>
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female" class="ml-4"> Female
      <input type="radio" name="gender" value="Other" class="ml-4"> Other
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Course</label>
      <select id="course" class="w-full border p-2 rounded">
        <option>Python</option>
        <option>Java</option>
        <option>JavaScript</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Email</label>
      <input type="email" id="email" class="w-full border p-2 rounded">
    </div>

    <button id="saveBtn" class="w-full bg-black text-white p-2 rounded">Save</button>
  </div>

  <h2 class="text-2xl font-bold mt-8">Registered List</h2>

  <table class="w-11/12 mt-4 border-collapse border" id="studentTable">
    <thead>
      <tr class="bg-gray-200">
        <th class="border p-2">S.No</th>
        <th class="border p-2">Name</th>
        <th class="border p-2">Age</th>
        <th class="border p-2">Gender</th>
        <th class="border p-2">Course</th>
        <th class="border p-2">Email</th>
        <th class="border p-2">Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Student rows will appear here -->
    </tbody>
  </table>

  <script src="script.js"></script>

</body>
</html>
